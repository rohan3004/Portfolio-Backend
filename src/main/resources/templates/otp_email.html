<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark only">
    <meta name="supported-color-schemes" content="dark only">
    <title>Secure Verification</title>
    <style>
        /* Reset */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #000000; color: #ffffff; -webkit-font-smoothing: antialiased; }
        table { border-spacing: 0; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }

        /* --- ANIMATIONS --- */

        /* 1. Slide In Entry */
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: slideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 2. The "Breathing" Core Pulse */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 122, 255, 0.2); border-color: #005bea; }
            50% { box-shadow: 0 0 40px rgba(0, 122, 255, 0.6); border-color: #00c6fb; }
            100% { box-shadow: 0 0 15px rgba(0, 122, 255, 0.2); border-color: #005bea; }
        }
        .power-cell {
            animation: pulseGlow 3s infinite ease-in-out;
            transition: transform 0.2s ease;
            cursor: text;
        }
        .power-cell:hover {
            transform: scale(1.02);
        }

        /* Mobile adjustments */
        @media only screen and (max-width: 600px) {
            .wrapper { padding: 10px !important; }
            .glass-container { width: 100% !important; }
            .otp-text { font-size: 36px !important; letter-spacing: 6px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #050505; color: #ffffff;">

<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #050505;">
    <tr>
        <td align="center" class="wrapper" style="padding: 60px 20px;">

            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 460px;" class="animate-entry">
                <tr>
                    <td class="glass-container" style="background-color: #151517; border: 2px solid #2c2c2e; border-top-color: #444447; border-radius: 20px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,0.9);">

                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td align="center" style="padding: 45px 40px 25px 40px; border-bottom: 1px solid #222224;">
                                    <p style="margin: 0 0 12px 0; font-size: 10px; text-transform: uppercase; letter-spacing: 4px; color: #007AFF; font-weight: 800;">
                                        Rohan Chakravarty
                                    </p>
                                    <h1 style="margin: 0; font-size: 24px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; text-transform: uppercase;">
                                        Access Control
                                    </h1>
                                    <p style="margin: 10px 0 0 0; font-size: 12px; color: #8e8e93; font-weight: 500;">
                                        “Secure by Design. Trusted by All.”
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td style="padding: 40px 40px 50px 40px; text-align: center;">

                                    <p style="margin: 0 0 40px 0; font-size: 14px; line-height: 1.6; color: #d1d1d6;">
                                        Identity verification initiated for <span th:text="${username}" style="color: #ffffff; font-weight: 700;">User</span>.
                                    </p>

                                    <div class="power-cell" style="background: #0a0a0c; border: 2px solid #005bea; border-radius: 16px; padding: 30px 10px; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0, 122, 255, 0.3);">

                                            <span style="font-size: 9px; color: #007AFF; display: block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 3px; font-weight: 800;">
                                                Protocol Key
                                            </span>

                                        <span class="otp-text" th:text="${otpCode}" style="font-family: SF Mono, Consolas, monospace; font-size: 46px; font-weight: 800; color: #ffffff; letter-spacing: 12px; line-height: 1; text-shadow: 0 0 25px rgba(0,122,255,0.9); position: relative; z-index: 2;">
                                                123456
                                            </span>

                                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; height: 40px; background: rgba(0, 122, 255, 0.12); filter: blur(25px); z-index: 1;"></div>
                                    </div>

                                    <p style="margin: 35px 0 0 0; font-size: 12px; color: #636366;">
                                        Key expires in <span th:text="${otpExpiryMinutes}" style="color: #d1d1d6;">5</span> minutes.<br>
                                        Tap and hold the code above to copy.
                                    </p>

                                </td>
                            </tr>
                        </table>

                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td style="background-color: #101012; border-top: 1px solid #222224; padding: 25px; text-align: center;">
                                    <p style="margin: 0; font-size: 10px; color: #48484a; line-height: 1.6; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;">
                                        Automated Security Protocol<br>
                                        &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> Rohan Chakravarty
                                    </p>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
</body>
</html>
